<!doctype html>
<html><head><meta charset="utf-8">
<title>Diwali greeting 9:16</title>
<script src="./vendor/gsap.min.js"></script>
<style>
@font-face{font-family:Manrope;src:url(./fonts/manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:block}
@font-face{font-family:Playfair;src:url(./fonts/playfair-display-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Playfair;src:url(./fonts/playfair-display-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:Playfair;src:url(./fonts/playfair-display-latin-500-italic.woff2) format('woff2');font-weight:500;font-style:italic;font-display:block}
:root{--night1:#0B0726;--night2:#22104A;--night3:#4A1C4E;--ivory:#FFF8EC;--navy:#16104F;--gold:#F2B33D;--goldDeep:#A3590A;--muted:#5C4A3A}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--night1)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif}
*{box-sizing:border-box}
.abs{position:absolute;left:0;top:0}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 48%,var(--night3) 82%,#7A3A3A 100%)}
#horizon{position:absolute;left:-200px;right:-200px;bottom:-260px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,70,.55),rgba(255,140,50,.18) 60%,rgba(255,140,50,0))}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#diyas{position:absolute;left:0;right:0;top:1700px;height:200px}
.diya{position:absolute;width:150px;height:150px}
#ivory{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#FFFDF7 0%,#FFF8EC 55%,#FBEBD2 100%)}
#burstGlow{position:absolute;inset:0;mix-blend-mode:screen}
#goldFlood{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#FFE2A0 0%,#FFC25A 55%,#F2A040 100%)}
#diyas2{position:absolute;left:0;right:0;top:1715px;height:200px}
.h{position:absolute;left:0;right:0;text-align:center;margin:0}
#t1{top:330px;font-family:Playfair;font-style:italic;font-weight:500;font-size:100px;line-height:1.05;color:#FFD98A;text-shadow:0 0 28px rgba(255,190,90,.45)}
#t2{top:360px;font-family:Playfair;font-weight:600;font-size:88px;line-height:1.08;color:var(--navy);letter-spacing:-.01em}
.ln{display:inline-block}
.logo{position:absolute;left:50%;transform-origin:50% 50%}
.logo img{display:block;width:100%}
.shine{position:absolute;inset:0;mix-blend-mode:plus-lighter;opacity:.32;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(100deg,rgba(255,255,255,0) 35%,rgba(255,236,190,.95) 50%,rgba(255,255,255,0) 65%);background-size:300% 100%;background-repeat:no-repeat}
#divider{position:absolute;left:50%;top:1068px;width:280px;height:3px;margin-left:-140px;background:linear-gradient(90deg,rgba(214,150,40,0),#D6962A,rgba(214,150,40,0))}
#g1{top:340px;font-family:Playfair;font-weight:600;font-size:80px;line-height:1.14;color:var(--navy)}
#g1 .gold{font-style:italic;font-weight:500;color:var(--goldDeep)}
#hd{top:780px;font-family:Playfair;font-weight:700;font-size:150px;line-height:1.3;padding-bottom:.12em;letter-spacing:-.01em;background:linear-gradient(100deg,rgba(255,236,170,0) 42%,rgba(255,236,170,.95) 50%,rgba(255,236,170,0) 58%),linear-gradient(180deg,#D98A12 0%,#A3590A 70%,#8A4A08 100%);background-size:320% 100%,100% 100%;background-repeat:no-repeat;background-position:130% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(214,140,30,.28))}
#bigDiya{position:absolute;left:465px;top:1035px;width:150px;height:150px}
#from{top:1505px;font-size:38px;font-weight:600;color:var(--muted);letter-spacing:.01em}
#row{position:absolute;left:0;right:0;top:1585px;display:flex;align-items:center;justify-content:center;gap:24px}
#row img{height:64px;display:block}
#row .amp{font-family:Playfair;font-style:italic;font-weight:500;font-size:64px;color:var(--goldDeep);line-height:1}
#row img.ai{height:44px}
#rangoli{position:absolute;left:90px;top:520px;width:900px;height:900px}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="10" data-fps="60">
  <div id="sky"><div id="horizon"></div></div>
  <canvas id="night" width="1080" height="1920"></canvas>
  <div id="diyas"></div>
  <div id="burstGlow"></div>
  <div id="goldFlood"></div>
  <div id="ivory"></div>
  <div id="diyas2"></div>
  <svg id="rangoli" viewBox="-450 -450 900 900"></svg>
  <canvas id="glit" width="1080" height="1920"></canvas>

  <h1 class="h" id="t1">A spark of an idea.</h1>

  <h1 class="h" id="t2"><span class="ln" id="t2a">A world of</span><br><span class="ln" id="t2b">possibilities.</span></h1>
  <div class="logo" id="lCore" style="width:820px;top:790px;margin-left:-410px"><img src="./assets/logos/core.png"><div class="shine"></div></div>
  <div id="divider"></div>
  <div class="logo" id="lAdam" style="width:740px;top:1150px;margin-left:-370px"><img src="./assets/logos/adam.png"><div class="shine"></div></div>

  <h1 class="h" id="g1"><span class="ln" id="g1a">This Diwali, may your</span><br><span class="ln gold" id="g1b">brightest ideas</span><br><span class="ln" id="g1c">come to life.</span></h1>
  <h1 class="h" id="hd">Happy Diwali</h1>
  <svg id="bigDiya" viewBox="0 0 150 150"></svg>
  <div class="h" id="from">From all of us at</div>
  <div id="row"><img src="./assets/logos/softlabs.png" alt="Softlabs Group"><span class="amp">&amp;</span><img class="ai" src="./assets/logos/ainfinite.png" alt="Ainfinite AI"></div>
</div>
<script type="module" src="./reel.js"></script>
</body></html>
